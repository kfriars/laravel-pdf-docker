name: Build and publish docker images

on:
  push:
    branches:
    - master
  schedule:
  # Weekly rebuild so the images pick up PHP and Alpine patch releases.
  - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  IMAGE: kfriars/laravel-pdf

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - php: '8.5'
          tags: '8.5'
        - php: '8.4'
          tags: '8.4 latest stable'
        - php: '8.3'
          tags: '8.3'
        - php: '8.2'
          tags: '8.2'

    steps:
    - uses: actions/checkout@v6

    - name: Build
      uses: docker/build-push-action@v7
      with:
        pull: true
        load: true
        build-args: PHP_VERSION=${{ matrix.php }}
        tags: ${{ env.IMAGE }}:${{ matrix.php }}

    - name: Test
      env:
        TEST_IMAGE: ${{ env.IMAGE }}:${{ matrix.php }}
      run: |
        docker run --rm "$TEST_IMAGE" php -v
        docker run --rm "$TEST_IMAGE" php -r 'exit(extension_loaded("ldap") ? 0 : 1);'
        docker run --rm "$TEST_IMAGE" pdftotext -v
        echo "\`$TEST_IMAGE\`: PHP $(docker run --rm "$TEST_IMAGE" php -r 'echo PHP_VERSION;')" >> "$GITHUB_STEP_SUMMARY"

    - name: Image tags
      id: meta
      env:
        TAGS: ${{ matrix.tags }}
      run: |
        {
          echo 'tags<<EOF'
          for tag in $TAGS; do echo "$IMAGE:$tag"; done
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push
      uses: docker/build-push-action@v7
      with:
        push: true
        build-args: PHP_VERSION=${{ matrix.php }}
        tags: ${{ steps.meta.outputs.tags }}
